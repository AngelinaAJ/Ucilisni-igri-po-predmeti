<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Реченица или не</title>
  <style>
    :root{--ink:#15324a;--blue:#1779c4;--pale:#eef7ff;--green:#198754;--red:#d04444;--gold:#f4b942}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf6ff,#fff8dd);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(960px,96vw);background:#fff;border-radius:28px;box-shadow:0 18px 55px #31536b30;padding:28px;text-align:center}
    h1{font-size:clamp(30px,5vw,54px);margin:0 0 6px}.lead{font-size:clamp(16px,2vw,22px);margin:0 0 18px}
    .top{display:flex;justify-content:space-between;gap:16px;font-weight:700;font-size:18px;margin-bottom:12px}.bar{height:14px;background:#dde9f0;border-radius:99px;overflow:hidden}.fill{height:100%;width:10%;background:linear-gradient(90deg,var(--blue),#55b7ec);transition:.3s}
    .card{margin:28px auto 20px;background:var(--pale);border:3px solid #b9d9ee;border-radius:24px;padding:35px 20px;min-height:190px;display:grid;place-items:center}
    #text{font-size:clamp(30px,5vw,54px);font-weight:800;line-height:1.2}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{border:0;border-radius:20px;padding:22px 14px;color:#fff;font-size:clamp(22px,3vw,34px);font-weight:800;cursor:pointer;box-shadow:0 7px 0 #0002;transition:.12s}.choice:active{transform:translateY(4px);box-shadow:0 3px 0 #0002}.yes{background:var(--green)}.no{background:var(--red)}
    #feedback{min-height:64px;margin:18px 0 4px;font-size:22px;font-weight:700}.explain{display:block;font-size:17px;font-weight:400;margin-top:6px}
    #next{display:none;margin:auto;border:0;border-radius:16px;padding:14px 30px;background:var(--blue);color:#fff;font-size:21px;font-weight:700;cursor:pointer}.restart{background:var(--gold)!important;color:#28333d!important}
    .hint{font-size:16px;color:#526878;margin-top:15px}@media(max-width:620px){main{padding:20px 15px}.choices{grid-template-columns:1fr}.card{min-height:155px;padding:25px 12px}}
  </style>
</head>
<body>
<main>
  <h1>Реченица или не?</h1>
  <p class="lead">Прочитај. Дали зборовите кажуваат цела мисла?</p>
  <div class="top"><span id="progress">Пример 1 од 10</span><span id="score">Точни: 0</span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <section class="card"><div id="text"></div></section>
  <div class="choices" id="choices">
    <button class="choice yes" onclick="answer(true)">✓ РЕЧЕНИЦА</button>
    <button class="choice no" onclick="answer(false)">✗ НЕ Е РЕЧЕНИЦА</button>
  </div>
  <div id="feedback" aria-live="polite"></div>
  <button id="next" onclick="nextItem()">Следен пример →</button>
  <p class="hint">Помош: запрашај се „Разбирам ли целосно што се случува?“</p>
</main>
<script>
const items=[
 {t:'Девојчето чита книга.',ok:true,e:'Знаеме кој и што прави.'},
 {t:'Во училишниот двор.',ok:false,e:'Не знаеме што се случува во дворот.'},
 {t:'Птиците летаат на југ.',ok:true,e:'Мислата е целосна и јасна.'},
 {t:'Жолти и црвени.',ok:false,e:'Не знаеме што е жолто и црвено.'},
 {t:'Марко собира костени.',ok:true,e:'Знаеме кој и што прави.'},
 {t:'Под високото дрво.',ok:false,e:'Не знаеме кој или што е под дрвото.'},
 {t:'Ветерот ги ниша гранките.',ok:true,e:'Мислата е целосна.'},
 {t:'Во кошницата има.',ok:false,e:'Недостига што има во кошницата.'},
 {t:'Децата играат со топка.',ok:true,e:'Реченицата кажува цела мисла.'},
 {t:'Малото кафеаво куче.',ok:false,e:'Не знаеме што прави кучето.'}
];
function shuffle(list){
  const a=[...list];
  for(let n=a.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}
  return a;
}
function mixedOrder(){
  const yes=shuffle(items.filter(x=>x.ok));
  const no=shuffle(items.filter(x=>!x.ok));
  const startWithSentence=Math.random()<.5;
  const result=[];
  for(let n=0;n<Math.max(yes.length,no.length);n++){
    if(startWithSentence){if(yes[n])result.push(yes[n]);if(no[n])result.push(no[n]);}
    else{if(no[n])result.push(no[n]);if(yes[n])result.push(yes[n]);}
  }
  return result;
}
let order=mixedOrder(),i=0,score=0,locked=false;
const text=document.getElementById('text'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),choices=document.getElementById('choices');
function show(){locked=false;text.textContent=order[i].t;feedback.innerHTML='';next.style.display='none';choices.style.display='grid';document.getElementById('progress').textContent=`Пример ${i+1} од ${order.length}`;document.getElementById('score').textContent=`Точни: ${score}`;document.getElementById('fill').style.width=`${(i+1)/order.length*100}%`}
function answer(v){if(locked)return;locked=true;const good=v===order[i].ok;if(good)score++;feedback.innerHTML=(good?'Браво, точно!':'Обиди се да објасниш зошто.')+`<span class="explain">${order[i].e}</span>`;document.getElementById('score').textContent=`Точни: ${score}`;next.style.display='block'}
function nextItem(){i++;if(i<order.length){show();return}text.textContent=`Заврши! Освои ${score} од ${order.length} поени.`;choices.style.display='none';feedback.innerHTML=score===10?'Одлично ги препознаваш речениците!':'Уште еднаш прочитај ги примерите што не беа целосни мисли.';next.textContent='Играј повторно';next.classList.add('restart');next.style.display='block';next.onclick=()=>location.reload();document.getElementById('progress').textContent='Крај';document.getElementById('fill').style.width='100%'}
show();
</script>
</body>
</html>
