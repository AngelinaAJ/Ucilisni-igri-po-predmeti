<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173f75">
<title>Македонски јазик – Училишни игри</title>
<style>
:root{
  --ink:#173f75;
  --muted:#66758a;
  --bg1:#eef5ff;
  --bg2:#eafcf7;
  --shadow:0 10px 30px rgba(23,63,117,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}
.wrap{width:min(1000px,92vw);margin:0 auto;padding:48px 0 64px}
.topline{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.78);font-size:14px;font-weight:700}
h1{margin:16px 0 8px;font-size:clamp(34px,5vw,58px);line-height:1.02}
.lead{margin:0 0 28px;color:var(--muted);font-size:clamp(17px,2vw,21px)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{display:flex;align-items:center;gap:16px;min-height:128px;padding:24px;border-radius:22px;text-decoration:none;color:var(--ink);background:#ffc6d2;border:1px solid rgba(23,63,117,.08);box-shadow:var(--shadow);transition:.16s}
.card:hover{transform:translateY(-3px)}
.icon{display:grid;place-items:center;flex:0 0 58px;height:58px;border-radius:18px;background:rgba(255,255,255,.66);font-size:31px}
.card-title{font-size:clamp(21px,2.4vw,28px);font-weight:850}
.card-sub{margin-top:6px;color:#53667d;font-size:15px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink);text-decoration:none;font-weight:750}
@media(max-width:700px){.wrap{padding-top:28px}.grid{grid-template-columns:1fr}.card{min-height:104px;padding:20px}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← Назад кон предметите</a>
  <div class="topline">🔤 Македонски јазик</div>
  <h1>Македонски јазик</h1>
  <p class="lead">Избери игра.</p>

  <section class="grid">
    <a class="card" href="esenska-mapa.html">
      <div class="icon">🍂</div>
      <div>
        <div class="card-title">Есенска мапа</div>
        <div class="card-sub">Заедничка завршна активност</div>
      </div>
    </a>
  </section>
</main>
</body>
</html>
